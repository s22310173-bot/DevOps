# FarmCare — container web (nginx polos, HTTP saja).
# TLS, redirect HTTP→HTTPS, dan routing berdasarkan Host ditangani
# nginx-proxy di depan container ini (lihat docker-compose.yml).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Endpoint sehat untuk healthcheck container dan pipeline Jenkins.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API → Express. URI asli dipertahankan (/api/...), resolver Docker
    # dipakai agar IP container api bisa berubah tanpa reload nginx.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend http://api:3001;
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Routing SPA: refresh atau deep-link jatuh ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
