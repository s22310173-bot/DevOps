; H6 — Nonaktifkan fungsi PHP berbahaya.
; Padukan baris di bawah ke php.ini server (mis. /etc/php/8.1/apache2/php.ini),
; lalu restart layanan:
;   sudo systemctl restart apache2
;   # atau untuk php-FPM: sudo systemctl restart php8.1-fpm
;
; Catatan: .htaccess TIDAK bisa menonaktifkan fungsi ini; wajib lewat php.ini.

disable_functions = exec,system,shell_exec,passthru,popen,proc_open

; Rekomendasi penguatan tambahan (opsional, selaras dengan audit):
expose_php = Off
session.gc_maxlifetime = 1800
