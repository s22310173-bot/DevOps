# FarmCare — Apache XAMPP
#
# Layout di htdocs:
#   prjocetdevops/       source project — DILARANG diakses via HTTP
#   prjocetdevops-app/   hasil build frontend — satu-satunya folder publik

ProxyPreserveHost On

# Backend Node.js (npm run api)
ProxyPass        /api http://127.0.0.1:3001/api
ProxyPassReverse /api http://127.0.0.1:3001/api

# Blokir total akses HTTP ke source project (berisi .env, server, node_modules)
<Directory "C:/xampp/htdocs/prjocetdevops">
  Require all denied
</Directory>

# Build frontend: routing SPA (refresh/deep-link jatuh ke index.html)
<Directory "C:/xampp/htdocs/prjocetdevops-app">
  FallbackResource /prjocetdevops-app/index.html
</Directory>
